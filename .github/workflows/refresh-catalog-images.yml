name: Actualizar fotos oficiales del catálogo
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-catalog-images.py'
      - 'scripts/fetch-catalog-images.py'
      - 'scripts/fetch-catalog-galleries.py'
      - '.github/workflows/refresh-catalog-images.yml'
permissions:
  contents: write
concurrency:
  group: lunivo-public-catalog
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -p 'test_catalog_images.py'
      - name: Buscar nuevos modelos y colores oficiales
        run: |
          python scripts/discover-catalog-images.py
          python scripts/fetch-catalog-galleries.py
      - name: Guardar fotos verificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalogo/product-images.json catalogo/assets/products
          if ! git diff --cached --quiet; then
            git commit -m 'Agregar fotos oficiales de nuevos modelos y colores'
            git push origin HEAD:main
          fi
