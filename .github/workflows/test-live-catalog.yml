name: Verificar servicio de inventario Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'workers/catalog/**'
      - 'catalogo/admin*'
      - 'catalogo/customization-core.js'
      - 'catalogo/catalog.js'
      - 'catalogo/gallery.js'
      - 'scripts/catalog-customizations.cjs'
      - 'scripts/sync-catalog-customizations.cjs'
      - 'scripts/refresh-public-catalog.py'
      - 'scripts/test-catalog-admin.cjs'
      - 'tests/catalog-customizations.test.cjs'
      - 'scripts/catalog-core.cjs'
      - 'scripts/build-public-catalog.cjs'
      - 'device-core.js'
      - 'feeds-core.js'
      - 'sales-core.js'
      - '.github/workflows/test-live-catalog.yml'
  pull_request:
    paths:
      - 'workers/catalog/**'
      - 'catalogo/admin*'
      - 'catalogo/customization-core.js'
      - 'catalogo/catalog.js'
      - 'catalogo/gallery.js'
      - 'scripts/catalog-customizations.cjs'
      - 'scripts/sync-catalog-customizations.cjs'
      - 'scripts/refresh-public-catalog.py'
      - 'scripts/test-catalog-admin.cjs'
      - 'tests/catalog-customizations.test.cjs'
      - 'scripts/catalog-core.cjs'
      - 'scripts/build-public-catalog.cjs'
      - 'device-core.js'
      - 'feeds-core.js'
      - 'sales-core.js'
      - '.github/workflows/test-live-catalog.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: workers/catalog
      - run: npm test
        working-directory: workers/catalog
      - run: npm run test:runtime
        working-directory: workers/catalog
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx playwright install --with-deps chromium
      - name: Probar administración y catálogo con el Worker real
        run: |
          python3 -m http.server 8000 > /tmp/admin-http.log 2>&1 &
          node scripts/test-catalog-admin.cjs
