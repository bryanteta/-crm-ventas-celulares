name: Actualizar inventario público de Lunivo

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-catalog.yml'
      - 'scripts/refresh-public-catalog.py'
      - 'scripts/fetch-provider-snapshot.py'
      - 'scripts/build-public-catalog.cjs'
      - 'feeds-core.js'
      - 'sales-core.js'
      - 'catalogo/index.html'
      - 'catalogo/catalog.js'
      - 'catalogo/product-images.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: lunivo-public-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar configuración
        env:
          SPLIT_INVENTORY_TOKEN: ${{ secrets.SPLIT_INVENTORY_TOKEN }}
        run: |
          if [ -z "$SPLIT_INVENTORY_TOKEN" ]; then
            echo '::error::Agrega SPLIT_INVENTORY_TOKEN en Settings > Secrets and variables > Actions. Se conserva el catálogo publicado.'
            exit 1
          fi
      - name: Consultar fuentes y preparar inventario público
        env:
          SPLIT_INVENTORY_TOKEN: ${{ secrets.SPLIT_INVENTORY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/refresh-public-catalog.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::No se pudo consultar el inventario. Reintento $attempt de 2; se conserva la última publicación."
              sleep "$((attempt * 5))"
            fi
          done
          echo '::error::No se pudo preparar un inventario válido tras tres intentos. Se conserva el catálogo publicado.'
          exit 1
      - name: Probar integridad y privacidad
        run: npm test
      - name: Guardar catálogo para publicación automática
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalogo/inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar inventario público de Lunivo'
            git push origin HEAD:main
          fi
          # Preserve the current site until the owner switches Pages to Actions.
          # In workflow mode, deployment follows automatically via workflow_run.
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" = legacy ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
